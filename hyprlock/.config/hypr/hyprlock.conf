# hyprlock — HyDE default layout (hyprlock/HyDE.conf) with static Tokyo Night colours.
# Big clock top-right, date under it, greeting centre, pill input at the bottom.

$fontFamily = JetBrainsMono Nerd Font
$wall = ~/.config/backgrounds/rose-pine-mountain-dragons.jpg
$fn_greet = echo "Good $(date +%H | awk '{if ($1 < 12) print "Morning"; else if ($1 < 18) print "Afternoon"; else print "Evening"}'), ${USER}"

# Tokyo Night
$text    = rgba(192, 202, 245, 1.0)   # c0caf5
$subtext = rgba(169, 177, 214, 1.0)   # a9b1d6
$bg      = rgba(36, 40, 59, 0.85)     # 24283b
$purple  = rgba(187, 154, 247, 1.0)   # bb9af7
$blue    = rgba(122, 162, 247, 1.0)   # 7aa2f7
$yellow  = rgba(224, 175, 104, 1.0)   # e0af68
$red     = rgba(247, 118, 142, 1.0)   # f7768e

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wall
    color = rgba(36, 40, 59, 1.0)
    blur_passes = 2
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    font_family = $fontFamily
    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $subtext
    font_size = 25
    font_family = $fontFamily
    position = -30, -150
    halign = right
    valign = top
}

# GREETING
label {
    monitor =
    text = cmd[update:60000] $fn_greet
    color = $text
    font_size = 20
    font_family = $fontFamily Bold
    position = 0, -16%
    halign = center
    valign = center
}

# INPUT
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $purple
    inner_color = $bg
    font_color = $text
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = $blue
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $yellow
    swap_font_color = true
    position = 0, 4.5%
    halign = center
    valign = bottom
}

# CAPS LOCK warning (kept from the previous config)
label {
    monitor =
    text = cmd[update:200] [[ $(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | head -1) == 1 ]] && echo "CAPS LOCK ON" || echo ""
    color = $yellow
    font_size = 14
    font_family = $fontFamily
    position = 0, 11%
    halign = center
    valign = bottom
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = $blue
    font_size = 18
    font_family = $fontFamily
    position = -2%, 1%
    halign = right
    valign = bottom
}
