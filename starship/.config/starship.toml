"$schema" = 'https://starship.rs/config-schema.json'

# 🌙 Minimal prompt, limpio y sin tanto color de fondo
format = """\
$os\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$python\
$docker_context\
$kubernetes\
$time\
$line_break\
$character"""

palette = 'tokyo_night'

# 🎨 Paleta — Tokyo Night (mismos nombres que la de Catppuccin para no tocar los módulos)
[palettes.tokyo_night]
text = "#c0caf5"
overlay1 = "#565f89"
blue = "#7aa2f7"
green = "#9ece6a"
yellow = "#e0af68"
peach = "#ff9e64"
teal = "#73daca"
sky = "#7dcfff"
purple = "#bb9af7"
mantle = "#1f2335"
red = "#f7768e"

# Catppuccin Mocha kept for reference: switch with palette = 'catppuccin_mocha'
[palettes.catppuccin_mocha]
text = "#cdd6f4"
overlay1 = "#7f849c"
blue = "#89b4fa"
green = "#a6e3a1"
yellow = "#f9e2af"
peach = "#fab387"
teal = "#94e2d5"
sky = "#89dceb"
purple = "#b4befe"
mantle = "#181825"
red = "#f38ba8"

