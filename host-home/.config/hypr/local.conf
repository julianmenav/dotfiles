# Home desktop — CachyOS, RTX 4060 (nvidia-open)
# Sourced at the end of hyprland.conf, so $mainMod & co. are available here.

# Monitors — https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-2,1920x1080@165,0x0,1
monitor=HDMI-A-1,1920x1080@60,1920x0,1

# NVIDIA — https://wiki.hypr.land/Nvidia/
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Uncomment if the cursor flickers or disappears
# cursor {
#     no_hardware_cursors = true
# }

# Polkit agent so GUI apps can ask for a password
exec-once = systemctl --user start hyprpolkitagent

# Dofus 3 (Unity, XWayland): never tile it. When tiled, Unity saves the tile
# size as the game resolution and renders a downscaled viewport into the slot
# ("everything looks zoomed out"). Force fullscreen on the monitor it opens on.
windowrule {
    name = dofus-fullscreen
    match:class = ^(Dofus\.x64)$
    # NOTE: `fullscreen = true` is silently ignored on 0.56.2 (tested);
    # fullscreen_state = <internal> <client>, 2 = fullscreen, works.
    fullscreen_state = 2 2
}

# Video wallpaper (mpvpaper, pacman -S mpvpaper). The video is not in the repo: ~/Videos/wallpapers.
# Starts after hyprpaper (this file is sourced last) so it sits on top of the static wallpaper.
# -p pauses playback while a fullscreen window hides it; no-audio, loop, hardware decoding.
exec-once = mpvpaper -p -o "no-audio loop hwdec=auto" '*' ~/Videos/wallpapers/pinterest-69735494225962758.mp4
