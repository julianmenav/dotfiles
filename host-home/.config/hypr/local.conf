# Home desktop — CachyOS, RTX 4060 (nvidia-open)
# Sourced at the end of hyprland.conf, so $mainMod & co. are available here.

# Monitors — https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-2,1920x1080@165,0x0,1
monitor=HDMI-A-1,1920x1080@60,1920x0,1

# NVIDIA — https://wiki.hypr.land/Nvidia/
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Uncomment if the cursor flickers or disappears
# cursor {
#     no_hardware_cursors = true
# }

# Polkit agent so GUI apps can ask for a password
exec-once = systemctl --user start hyprpolkitagent
