# Home desktop: CachyOS, RTX 4060 (nvidia-open). Sourced at the end of hyprland.conf.

# Monitors — https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-2,1920x1080@165,0x0,1
monitor=HDMI-A-1,1920x1080@60,1920x0,1

# NVIDIA — https://wiki.hypr.land/Nvidia/
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Uncomment if the cursor flickers or disappears
# cursor {
#     no_hardware_cursors = true
# }

# Polkit agent so GUI apps can ask for a password
exec-once = systemctl --user start hyprpolkitagent

# Dofus 3 (Unity, XWayland): never tile it. When tiled, Unity saves the tile
# size as the game resolution and renders a downscaled viewport into the slot
# ("everything looks zoomed out"). Force fullscreen on the monitor it opens on.
windowrule {
    name = dofus-fullscreen
    match:class = ^(Dofus\.x64)$
    # NOTE: `fullscreen = true` is silently ignored on 0.56.2 (tested);
    # fullscreen_state = <internal> <client>, 2 = fullscreen, works.
    fullscreen_state = 2 2
}

# Baldur's Gate 3 (native SDL2 build, XWayland): SDL drops fullscreen when the
# window loses focus (mouse crossing to the other monitor). Ignore fullscreen
# requests coming from the client so only Super+Shift+F changes it.
windowrule {
    name = bg3-keep-fullscreen
    match:class = ^(bg3)$
    suppress_event = fullscreen
}

# Video wallpaper (mpvpaper). The file is not in the repo; fetch it with:
#   yt-dlp -f 620 -o ~/Videos/wallpapers/waneella-lull.mp4 https://www.youtube.com/watch?v=PSBjS2xppec
#   ffmpeg -ss 10 -i ~/Videos/wallpapers/waneella-lull.mp4 -frames:v 1 ~/Videos/wallpapers/waneella-lull.png
# -p pauses under fullscreen windows, panscan fills 16:9.
exec-once = mpvpaper -p -o "no-audio loop hwdec=auto panscan=1.0" '*' ~/Videos/wallpapers/waneella-lull.mp4
