# hyprpaper >= 0.8 syntax (the old preload/wallpaper lines are ignored silently).
# Wallpapers: HyDE "Rosé Pine" set plus the Tokyo Night lo-fi café (backgrounds stow package).
# Cycle them with Super+Shift+W (scripts/wallpaper-next.sh) or:
#   hyprctl hyprpaper wallpaper ",~/.config/backgrounds/rose-pine-burning-cherry.jpg"
# Others: rose-pine-burning-cherry.jpg, rose-pine-lakeside-sunset.jpg, tokyo-night-cat-lofi-cafe.jpg

wallpaper {
    monitor =
    path = ~/.config/backgrounds/rose-pine-mountain-dragons.jpg
    fit_mode = cover
}
