# hyprpaper >= 0.8 syntax (the old preload/wallpaper lines are ignored silently).
# Wallpapers come from the HyDE "Tokyo Night" theme (backgrounds stow package).
# Cycle them with Super+Shift+W (scripts/wallpaper-next.sh) or:
#   hyprctl hyprpaper wallpaper ",~/.config/backgrounds/tokyo-night-pink.png"

wallpaper {
    monitor =
    path = ~/.config/backgrounds/tokyo-night-edgerunners-lucy.jpg
    fit_mode = cover
}
