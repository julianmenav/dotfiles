# hyprpaper >= 0.8 syntax (the old preload/wallpaper lines are ignored silently).
#
# Wallpapers live in ~/.config/backgrounds (= backgrounds/.config/backgrounds in the dotfiles repo,
# so they are versioned and shared with the other machine). To use your own:
#   1. copy the image there (png/jpg), e.g. ~/.config/backgrounds/my-wall.jpg
#   2. change `path` below (and $wall in hyprlock.conf) -> hyprctl reload does NOT restart
#      hyprpaper; apply live with:  hyprctl hyprpaper wallpaper ",~/.config/backgrounds/my-wall.jpg"
#   Super+Shift+W cycles through every image in that folder (except black.png / solid-*.png).
#
# Placeholder until you pick one: a flat Tokyo Night background colour.

# hyprpaper 0.8 draws Hyprland's splash quote over the wallpaper by default — off.
splash = false

wallpaper {
    monitor =
    path = ~/.config/backgrounds/solid-tokyo-night.png
    fit_mode = cover
}
