# kitty — HyDE base settings (hyde.conf) + Tokyo Night colours in theme.conf
include theme.conf

font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10

window_padding_width 12
cursor_shape underline
cursor_trail 1
enable_audio_bell no
confirm_os_window_close 0

# Transparency is handled by Hyprland (decoration:active_opacity), like HyDE does
background_opacity 1.0
