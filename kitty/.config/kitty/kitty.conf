# BEGIN_KITTY_THEME
# Nord
include current-theme.conf
# END_KITTY_THEME

# Font — mirrors `fc-match monospace` on this machine (Noto Sans Mono Regular).
# Kitty consults fontconfig for missing glyphs, so PowerlineSymbols / DejaVu Sans Mono /
# WenQuanYi Zen Hei Mono fall in automatically via the system fontconfig chain.
font_family      Noto Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10

# Cursor
cursor_shape underline

# Window
background_opacity 0.8
confirm_os_window_close 0
