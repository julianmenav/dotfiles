# Work machine. Sourced at the end of hyprland.conf.

# Monitors — https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-1,preferred,0x0,1
monitor=HDMI-A-1,preferred,auto,1

# Slack
bind = $mainMod, S, exec, /usr/bin/slack --disable-gpu-compositing --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime --enable-features=WebRTCPipeWireCapturer --enable-features=WaylandWindowDecorations --disable-features=WaylandFractionalScaleV1
